[Search]
# Global hotkey to show the search bar.
# Examples: ctrl+space, ctrl+alt+s, alt+f1
hotkey = ctrl+space

# Google account index to use (0 = first/default, 1 = second, etc.)
# Open cloudsearch.google.com in your browser and check which account
# is active — or switch accounts and note the /u/N/ number in the URL.
account_index = 0

# Browser to open results in. Leave blank to use the system default.
# Common values: chrome, firefox, msedge
# On Windows you can also use a full path, e.g.: C:\Program Files\Google\Chrome\Application\chrome.exe
browser =

[Window]
width = 620
height = 60

[LocalSearch]
# Future feature: search the local filesystem in addition to Cloud Search.
# Set enabled = true and configure paths when this feature is added.
enabled = false
# Comma-separated list of root paths to search
# paths = C:\Users\cduff\Documents, D:\Projects
